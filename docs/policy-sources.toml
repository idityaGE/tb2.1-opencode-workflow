[manifest]
version = 1
synchronized_on = "2026-07-20"
upstream_root = "../../docs"
copied_root = "tb2"
local_root = "local"
upstream_path_rule = "For copied entries, remove the leading tb2/ from the manifest path and append the remainder to upstream_root."
overlay = "Copied text is preserved except that positive tests/test.sh bodies are replaced by references to .opencode/templates/tests/test.sh and insignificant trailing whitespace is normalized."

[precedence]
order = ["current-status", "local-operational", "normative", "advisory", "historical"]
rule = "Current-status sources control dated availability. Local-operational policy may narrow but never relax current-status or normative requirements. Advisory and historical sources never override the first three classes."
conflict_action = "Use the newer topic-specific source; if the conflict remains material, stop and ask instead of inventing policy."

[[sources]]
classification = "current-status"
synchronized_on = "2026-07-20"
upstream_root = "../../docs"
files = [
  "tb2/category-status.md",
  "tb2/changelog.md",
  "tb2/rate-schedule.md",
]

